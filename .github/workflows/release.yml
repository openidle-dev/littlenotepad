name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      - name: Install Windows dependencies
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          choco install wixtoolset --no-progress -y
          $wix = Get-ChildItem "C:\Program Files (x86)" -Filter "WiX Toolset*" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($wix) { "$($wix.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }

      - name: Cache Tauri tools (WiX)
        if: matrix.platform == 'windows'
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\tauri
          key: tauri-tools-windows

      - name: Cache Tauri tools (AppImage)
        if: matrix.platform == 'linux'
        uses: actions/cache@v4
        with:
          path: ~/.local/share/tauri
          key: tauri-tools-linux

      - name: Install macOS dependencies
        if: matrix.platform == 'macos'
        run: brew install create-dmg

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.11" --locked

      - name: Patch version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          perl -i -pe "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
          perl -i -pe "s/^version = \"[^\"]*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml

      - name: Audit dependencies
        run: |
          cargo install cargo-audit --locked
          cargo audit
        working-directory: src-tauri
        continue-on-error: true

      - name: Build
        run: cargo tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""

      - name: Strip Mark-of-the-Web (MSI)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path "src-tauri/target/release/bundle/msi" -Filter "*.msi" -Recurse | Select-Object -First 1
          if ($msi) { Unblock-File -Path $msi.FullName }

      - name: Strip Mark-of-the-Web (NSIS)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $nsis = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -Recurse | Select-Object -First 1
          if ($nsis) { Unblock-File -Path $nsis.FullName }

      - name: Collect Windows artifacts
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          Copy-Item -Path "src-tauri/target/release/bundle/msi/*.msi"  -Destination artifacts/ -ErrorAction SilentlyContinue
          Copy-Item -Path "src-tauri/target/release/bundle/nsis/*.exe" -Destination artifacts/ -ErrorAction SilentlyContinue

      - name: Collect Linux artifacts
        if: matrix.platform == 'linux'
        run: |
          mkdir -p artifacts
          cp src-tauri/target/release/bundle/deb/*.deb           artifacts/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/rpm/*.rpm           artifacts/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/appimage/*.AppImage artifacts/ 2>/dev/null || true

      - name: Collect macOS artifacts
        if: matrix.platform == 'macos'
        run: |
          mkdir -p artifacts
          cp src-tauri/target/release/bundle/dmg/*.dmg artifacts/ 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: littlenotepad-${{ matrix.platform }}-${{ github.ref_name }}
          path: artifacts/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "LittleNotepad ${{ github.ref_name }}" \
            --draft \
            $(find release-artifacts -type f | tr '\n' ' ')
